<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Valistoque</title>
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(to bottom,#fff 70%,#4682B4 100%)}.container{width:420px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.2);border-radius:10px;padding:30px 40px;box-shadow:0 0 10px rgba(0,0,0,.2);backdrop-filter:blur(20px)}h1{font-size:36px;text-align:center;margin-bottom:20px}.box{position:relative;width:100%;height:50px;margin:20px 0}.box input,.box select{width:100%;height:100%;background:transparent;border:2px solid rgba(0,0,0,.2);border-radius:40px;outline:none;font-size:16px;color:#111;padding:0 45px 0 20px}.box i{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:20px}.links{display:flex;justify-content:space-between;margin:12px 0 18px}.links a{color:#2c6f91;text-decoration:none;font-size:14px}.btn{width:100%;height:45px;background:#5ebddc;border:none;border-radius:40px;cursor:pointer;font-size:16px;font-weight:600}.btn:hover{background:transparent;border:2px solid #5ebddc}.baixo{text-align:center;color:#78bfd7;font-size:12px;margin-top:18px}
</style>
</head>
<body>
<main class="container">
<form id="login-form" novalidate>
<h1>Login</h1>
<div class="box"><input type="email" id="email" placeholder="Email" autocomplete="username" required><i class="bx bxs-user"></i></div>
<div class="box"><select id="perfil" required><option value="administrador">Administrador</option><option value="funcionario">Funcionário</option></select><i class="bx bxs-briefcase"></i></div>
<div class="box"><input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required><i class="bx bxs-lock-alt"></i></div>
<div class="links"><a href="recuperasenha.html">Esqueci minha senha</a><a href="Principal.html">Voltar ao início</a></div>
<button type="submit" class="btn">Entrar</button>
<p class="baixo">&copy; 2026 Valistoque. Todos os direitos reservados.</p>
</form>
</main>
<script src="../js/api.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
