<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha - Valistoque</title><style>body{font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f4f6f9}.box{width:380px;background:#fff;padding:28px;border-radius:12px;box-shadow:0 8px 24px #0001}input,button{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}button{background:#3498db;color:#fff;border:0;cursor:pointer}</style></head><body><main class="box"><h1>Redefinir senha</h1><p>Digite o código recebido e a nova senha.</p><form id="reset-form"><input id="email" type="email" placeholder="Email" required><input id="codigo" inputmode="numeric" maxlength="6" placeholder="Código de 6 dígitos" required><input id="senha" type="password" minlength="6" placeholder="Nova senha" required><input id="confirmar_senha" type="password" minlength="6" placeholder="Confirmar nova senha" required><button>Salvar nova senha</button></form><p><a href="login.html">Voltar ao login</a></p></main><script src="js/api.js"></script><script>const f=document.getElementById('reset-form');document.getElementById('email').value=sessionStorage.getItem('valistoqueRecoveryEmail')||'';f.addEventListener('submit',async e=>{e.preventDefault();try{await apiRequest('auth/redefinir_senha.php',{method:'POST',body:{email:email.value,codigo:codigo.value,senha:senha.value,confirmar_senha:confirmar_senha.value}});alert('Senha redefinida com sucesso.');sessionStorage.removeItem('valistoqueRecoveryEmail');location.href='login.html';}catch(err){alert(err.message)}});</script></body></html>
