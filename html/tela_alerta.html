<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Alertas - Funcionário</title>
<style>body{margin:0;font-family:Arial,sans-serif;display:flex;min-height:100vh;background:#f4f6f9;color:#333}.sidebar{width:260px;background:#395a72;display:flex;flex-direction:column;justify-content:space-between}.menu{padding:20px 0}.menu a{display:block;padding:14px 24px;color:#fff;text-decoration:none}.menu a:hover,.menu a.active{background:#e8f0fe;color:#1a73e8}.main{flex:1}.header{height:60px;background:#395a72;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.content{padding:30px}.section{background:#fff;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.05);margin-bottom:25px;overflow:hidden}.title{padding:16px 20px;background:#fafafa;border-bottom:1px solid #eee;font-weight:600}.list{padding:0;list-style:none}.item{padding:14px 20px;border-bottom:1px solid #f0f0f0;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:10px;align-items:center}.item button{border:0;background:none;color:#d93025;cursor:pointer}.empty{padding:20px;color:#666}.logout{border-top:1px solid rgba(255,255,255,.2);color:#ffb3b3!important}</style>
</head><body>
<aside class="sidebar"><div class="menu"><a class="active" href="tela_alerta.html">⚠️ Alertas</a></div><a class="logout" href="#" id="logout">🚪 Sair</a></aside>
<div class="main"><header class="header"><h2>Painel de Alertas</h2><span id="usuario-logado">👤 Funcionário</span></header><main class="content"><section class="section"><div class="title">Avisos de Estoque Mínimo</div><ul class="list" id="estoque-list"></ul></section><section class="section"><div class="title">Produtos Próximos ao Vencimento</div><ul class="list" id="validade-list"></ul></section></main></div>
<script src="../js/api.js"></script><script src="../js/guard-funcionario.js"></script><script src="../js/logout.js"></script><script>
(async function(){try{const r=await apiRequest('api/alerta.php?todos=1');const dados=r.dados||[];const est=document.getElementById('estoque-list');const val=document.getElementById('validade-list');const render=(arr,el)=>el.innerHTML=arr.length?arr.map(a=>`<li class="item"><strong>${a.produto||''}</strong><span>${a.lote||''}</span><span>${a.codigo_prateleira||''}</span><span>${a.referencia||''}</span><span>${a.status||''}</span><button onclick="marcar(${a.id})">×</button></li>`).join(''):'<li class="empty">Nenhum alerta.</li>';render(dados.filter(a=>a.tipo.includes('estoque')),est);render(dados.filter(a=>['validade_proxima','produto_vencido'].includes(a.tipo)),val);}catch(e){document.querySelectorAll('.list').forEach(x=>x.innerHTML='<li class="empty">Não foi possível carregar os alertas.</li>')}})();async function marcar(id){try{await apiRequest('api/alerta.php?id='+encodeURIComponent(id)+'&acao=ler',{method:'POST'});location.reload()}catch(e){alert(e.message)}}
</script>
</body></html>
